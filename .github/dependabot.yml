version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /apps/agent
    schedule:
      interval: weekly
    ignore:
      # strands-agents が mcp<2.0.0 を要求するため major 更新は入れられない(#58で衝突)
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
