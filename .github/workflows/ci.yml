name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      terraform: ${{ steps.filter.outputs.terraform }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            agent:
              - 'apps/agent/**'
            terraform:
              - 'infra/**'
            prod:
              - 'infra/envs/prod/**'

  node:
    runs-on: ubuntu-latest
    # repository層の統合テスト用(ADR 0017)。実AWSには接続しない。
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test

      # 統合テストのテーブルは infra/envs/local の terraform で作る。prod と同じ
      # modules/dynamodb を使うことで、キースキーマ・GSI・射影設定の乖離をゼロにする。
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Create tables on DynamoDB Local
        working-directory: infra/envs/local
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Integration test (DynamoDB Local)
        env:
          # 未起動・テーブル未作成を検知したら、スキップせず失敗させる
          REQUIRE_DYNAMODB_LOCAL: "1"
        run: npm run test:integration -w @aws-mon/api

      - name: Biome
        run: npm run lint

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/agent/requirements.txt
            apps/agent/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/agent/requirements.txt -r apps/agent/requirements-dev.txt

      - name: Ruff check
        run: ruff check apps/agent

      - name: Ruff format check
        run: ruff format --check apps/agent

      - name: Pytest
        working-directory: apps/agent
        run: pytest

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Terraform init
        working-directory: infra/envs/local
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/envs/local
        run: terraform validate

  # prodスタック変更時にPR上でplanを確認する(読み取り専用ロール、ロックなし)。
  # フォークからのPRはOIDCトークンを取得できないため同一リポジトリのPRに限定
  tf-plan:
    needs: changes
    if: >-
      needs.changes.outputs.prod == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}"

      - name: Terraform plan
        run: terraform plan -input=false -lock=false

  security:
    runs-on: ubuntu-latest
    # Dependabot起因のPRはトークンが読み取り制限されるため、gitleaksが必要とする
    # PR読み取りを明示的に付与する(無いとPRコミット一覧の取得が403になる)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # 無くてもスキャンは動くが、PRへの結果コメントに必要
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
