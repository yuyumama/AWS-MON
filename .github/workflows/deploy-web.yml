name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# S3同期とCloudFront invalidationの競合を防ぐため直列化(実行中のデプロイはキャンセルしない)
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Terraform/手動作成のSSMパラメータから、公開アプリに埋め込む値だけを取得する
      - name: Read deploy configuration
        id: config
        run: |
          set -euo pipefail

          get_parameter() {
            aws ssm get-parameter \
              --name "$1" \
              --query 'Parameter.Value' \
              --output text 2>/dev/null || true
          }

          API_BASE_URL="$(get_parameter /app/aws-mon/prod/api-base-url)"
          WEB_BUCKET="$(get_parameter /app/aws-mon/prod/web-bucket)"

          if [[ -z "${API_BASE_URL}" || "${API_BASE_URL}" == "None" || -z "${WEB_BUCKET}" || "${WEB_BUCKET}" == "None" ]]; then
            echo "インフラ未準備: api-base-url または web-bucket が未作成のためdeploy-webをスキップします"
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          COGNITO_USER_POOL_ID="$(get_parameter /app/aws-mon/prod/cognito-user-pool-id)"
          COGNITO_CLIENT_ID="$(get_parameter /app/aws-mon/prod/cognito-client-id)"
          CLOUDFRONT_DISTRIBUTION_ID="$(get_parameter /app/aws-mon/prod/cloudfront-distribution-id)"

          if [[ -z "${COGNITO_USER_POOL_ID}" || "${COGNITO_USER_POOL_ID}" == "None" ]]; then
            echo "missing SSM parameter: /app/aws-mon/prod/cognito-user-pool-id" >&2
            exit 1
          fi
          if [[ -z "${COGNITO_CLIENT_ID}" || "${COGNITO_CLIENT_ID}" == "None" ]]; then
            echo "missing SSM parameter: /app/aws-mon/prod/cognito-client-id" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFRONT_DISTRIBUTION_ID}" || "${CLOUDFRONT_DISTRIBUTION_ID}" == "None" ]]; then
            echo "missing SSM parameter: /app/aws-mon/prod/cloudfront-distribution-id" >&2
            exit 1
          fi

          {
            echo "ready=true"
            echo "api_base_url=${API_BASE_URL}"
            echo "web_bucket=${WEB_BUCKET}"
            echo "cognito_user_pool_id=${COGNITO_USER_POOL_ID}"
            echo "cognito_client_id=${COGNITO_CLIENT_ID}"
            echo "cloudfront_distribution_id=${CLOUDFRONT_DISTRIBUTION_ID}"
          } >> "${GITHUB_OUTPUT}"

      # Viteのビルド時環境変数としてCognito/API接続情報を注入する
      - name: Build web
        if: steps.config.outputs.ready == 'true'
        env:
          VITE_AUTH_MODE: cognito
          VITE_API_BASE_URL: ${{ steps.config.outputs.api_base_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.config.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.config.outputs.cognito_client_id }}
        run: |
          npm ci
          npm run build -w @aws-mon/shared
          npm run build -w @aws-mon/web

          # デプロイ後スモークが配信物の版を突き合わせるための出力(ADR 0017 決定6)。
          # apiの GET /health が返す sha と一致していれば版ずれが無いことも分かる。
          printf '{"sha":"%s"}' "${GITHUB_SHA}" > apps/web/dist/version.json

      # S3にはビルド成果物のみを同期し、削除済みファイルは--deleteで消す
      - name: Sync to S3
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          aws s3 sync apps/web/dist/ "s3://${{ steps.config.outputs.web_bucket }}/" --delete
          # version.json はキャッシュされると版の判定に使えないので上書きで no-cache にする
          aws s3 cp apps/web/dist/version.json \
            "s3://${{ steps.config.outputs.web_bucket }}/version.json" \
            --cache-control "no-cache, max-age=0"

      # SPAの全パスで新しいindex/assetsを見せるため、全体をinvalidationする
      - name: Invalidate CloudFront
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.config.outputs.cloudfront_distribution_id }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.config.outputs.cloudfront_distribution_id }}" \
            --id "${INVALIDATION_ID}"

      # デプロイ後スモーク(issue #103)。配信URLが200を返し、埋め込んだSHAが一致すること。
      # 失敗したらワークフローを赤にするだけで、自動ロールバックはしない(docs/cicd.md)。
      - name: Smoke test (delivered revision)
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          DOMAIN="$(aws cloudfront get-distribution \
            --id "${{ steps.config.outputs.cloudfront_distribution_id }}" \
            --query 'Distribution.DomainName' \
            --output text)"

          for attempt in {1..10}; do
            STATUS="$(curl -s -o response.json -w '%{http_code}' "https://${DOMAIN}/version.json" || true)"
            SERVED_SHA="$(python3 -c "import json;print(json.load(open('response.json')).get('sha',''))" 2>/dev/null || true)"

            if [[ "${STATUS}" == "200" && "${SERVED_SHA}" == "${GITHUB_SHA}" ]]; then
              echo "web smoke passed: ${DOMAIN} serves ${SERVED_SHA}"
              # SPAの入口自体が配信されていることも見る(version.jsonだけ残る事故を弾く)
              curl -fsS -o /dev/null "https://${DOMAIN}/"
              exit 0
            fi

            echo "web smoke ${attempt}/10: status=${STATUS} sha=${SERVED_SHA:-none} (expected ${GITHUB_SHA})"
            sleep 10
          done

          echo "配信中のwebが ${GITHUB_SHA} になっていない" >&2
          exit 1
