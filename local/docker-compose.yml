# ローカル開発用インフラ: DynamoDB Local + LocalStack
# 起動:  cd local && docker compose up -d
# 停止:  docker compose down          （データも消すなら -v）
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: aws-mon-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - ./volume/dynamodb:/data

  localstack:
    image: localstack/localstack:latest
    container_name: aws-mon-localstack
    ports:
      - "4566:4566"
    environment:
      # LocalStack Community(無料)で使えるサービスのみ。必要になったら追加する。
      # 注意: Cognito(cognito-idp)は LocalStack Pro 限定のため含めない。
      #   ローカルは devシム(x-dev-user-id)、本物の認証は実AWSのCognito(無料枠)に向けて検証する。
      - SERVICES=ssm,secretsmanager,s3
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - ./volume/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
